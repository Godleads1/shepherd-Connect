kind = "slides"
previewPath = "/support-guide/"
title = "Shepherd Connect — Support Guide"
version = "1.0.0"
id = "artifacts/support-guide"
router = "path"

[[integratedSkills]]
name = "slides"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/support-guide/" ]
localPort = 23935

[services.development]
run = "pnpm --filter @workspace/support-guide run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/support-guide", "run", "build" ]
publicDir = "artifacts/support-guide/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23935"
BASE_PATH = "/support-guide/"
