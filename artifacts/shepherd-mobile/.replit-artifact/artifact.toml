kind = "mobile"
previewPath = "/mobile/"
title = "Shepherd Connect — Mobile"
version = "1.0.0"
id = "artifacts/shepherd-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/mobile/" ]
localPort = 22960

[services.development]
run = "pnpm --filter @workspace/shepherd-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/shepherd-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/shepherd-mobile", "run", "serve" ]

[services.env]
PORT = "22960"
BASE_PATH = "/mobile/"
