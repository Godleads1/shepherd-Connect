<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Shepherd Connect</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/pwa-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Shepherd Connect" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Shepherd Connect" />
    <meta name="msapplication-TileColor" content="#1e3a8a" />
    <meta name="msapplication-TileImage" content="/pwa-192.png" />
    <meta name="theme-color" content="#1e3a8a" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

    <!-- Prevent flash of unstyled / wrong-theme content -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        /* matches the login page base colour so no white flash on load */
        background: #f8fafc;
        min-height: 100dvh;
      }
      /* dark-mode base so the dark theme doesn't flash light before JS runs */
      html.dark body { background: #0f172a; }
    </style>

    <!-- Redirect replit.app URL to custom domain -->
    <script>
      (function () {
        if (window.location.hostname.indexOf('replit.app') !== -1) {
          window.location.replace('https://shepherdconnect.intelyticslimited.com' + window.location.pathname + window.location.search + window.location.hash);
        }
      })();
    </script>

    <!-- Apply theme class synchronously before first paint to prevent flicker -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('shepherd-theme');
          var theme = stored === 'dark' || stored === 'light' ? stored
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.classList.add(theme);
        } catch (e) {
          document.documentElement.classList.add('light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
