kind = "slides"
previewPath = "/teacher-guide/"
title = "Shepherd Connect — Teacher Guide"
version = "1.0.0"
id = "artifacts/teacher-guide"
router = "path"

[[integratedSkills]]
name = "slides"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/teacher-guide/" ]
localPort = 20688

[services.development]
run = "pnpm --filter @workspace/teacher-guide run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/teacher-guide", "run", "build" ]
publicDir = "artifacts/teacher-guide/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20688"
BASE_PATH = "/teacher-guide/"
