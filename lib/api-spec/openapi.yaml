        - description
        - createdAt

    CreateEmergencyBody:
      type: object
      properties:
        type:
          type: string
          enum: [medical, missing_child, fire_evacuation, security, general]
        level:
          type: string
          enum: [L1, L2, L3, L4]
        childId:
