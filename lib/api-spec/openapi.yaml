          type: number
        negativePercent:
          type: number
      required:
        - positive
        - neutral
        - negative
        - unanalyzed
        - positivePercent
        - neutralPercent
        - negativePercent

    FeedbackAnalytics:
      type: object
      properties:
        averageRating:
          type: number
        averageClassExperience:
          type: number
        averageTeacherEngagement:
          type: number
        averageSafetyRating:
          type: number
        totalResponses:
          type: integer
        sentimentBreakdown:
          $ref: "#/components/schemas/SentimentBreakdown"
        recentFeedback:
          type: array
          items:
            $ref: "#/components/schemas/Feedback"
      required:
        - averageRating
        - averageClassExperience
        - averageTeacherEngagement
        - averageSafetyRating
        - totalResponses
        - sentimentBreakdown
        - recentFeedback

    ExceptionReport:
      type: object
      properties:
        unpickedChildren:
          type: array
          items:
            $ref: "#/components/schemas/Attendance"
        capacityOverflows:
          type: array
          items:
            $ref: "#/components/schemas/Class"
        pendingDelegateApprovals:
          type: array
          items:
            $ref: "#/components/schemas/PickupDelegate"
      required:
        - unpickedChildren
        - capacityOverflows
        - pendingDelegateApprovals

    # BROADCAST NOTIFICATION
    BroadcastNotificationBody:
      type: object
      properties:
        title:
          type: string
        message:
          type: string
        targetRoles:
          type: array
          items:
            type: string
            enum: [super_admin, admin, teacher, support, parent]
        targetUserIds:
          type: array
          items:
            type: integer
          nullable: true
      required:
        - title
        - message

    PreDismissalBody:
      type: object
      properties:
        serviceDate:
          type: string
        serviceSlot:
          type: string
          nullable: true
        minutesBefore:
          type: integer
          default: 15
      required:
        - serviceDate

    # CLASS CHANGE REQUEST
    ClassChangeRequest:
      type: object
      properties:
        id:
          type: integer
        childId:
          type: integer
        currentClassId:
          type: integer
          nullable: true
        requestedClassId:
          type: integer
        reason:
          type: string
          nullable: true
        status:
          type: string
          enum: [pending, approved, rejected]
        requestedBy:
          type: integer
        reviewedBy:
          type: integer
          nullable: true
        adminNotes:
          type: string
          nullable: true
        child:
          $ref: "#/components/schemas/Child"
          nullable: true
        currentClass:
          $ref: "#/components/schemas/Class"
          nullable: true
        requestedClass:
          $ref: "#/components/schemas/Class"
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - childId
        - requestedClassId
        - status
        - requestedBy
        - createdAt
        - updatedAt

    CreateClassChangeRequestBody:
      type: object
      properties:
        childId:
          type: integer
        requestedClassId:
          type: integer
        currentClassId:
          type: integer
          nullable: true
        reason:
          type: string
          nullable: true
      required:
        - childId
        - requestedClassId

    SafeguardingRecordInput:
      type: object
      required:
        - operationId
        - teacherUserId
        - checkType
      properties:
        operationId:
          type: string
          format: uuid
        teacherUserId:
          type: integer
        checkType:
          type: string
          minLength: 1
        referenceNumber:
          type: string
        issuedDate:
          type: string
        expiryDate:
          type: string
        status:
          type: string
          enum: [clear, pending, expired, not_submitted]
          default: pending
        notes:
          type: string

    SafeguardingRecord:
      type: object
      required: [id, teacherUserId, checkType, status, createdAt, updatedAt]
      properties:
        id: { type: integer }
        teacherUserId: { type: integer }
        checkType: { type: string }
        referenceNumber: { type: ["string", "null"] }
        issuedDate: { type: ["string", "null"] }
        expiryDate: { type: ["string", "null"] }
        status: { type: string, enum: [clear, pending, expired, not_submitted] }
        notes: { type: ["string", "null"] }
        createdBy: { type: ["integer", "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        teacher:
          type: ["object", "null"]
          properties:
            id: { type: integer }
            firstName: { type: string }
            lastName: { type: string }
            email: { type: string }
        isExpiringSoon: { type: boolean }
        isExpired: { type: boolean }

    SafeguardingOperationResult:
      allOf:
        - $ref: "#/components/schemas/SafeguardingRecord"
        - type: object
          required: [operationId, outcome]
          properties:
            operationId: { type: string, format: uuid }
            outcome: { type: string, enum: [applied, already_applied] }
