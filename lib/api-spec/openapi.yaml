openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Shepherd Connect - Children's Church Management Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: users
    description: User management
  - name: families
    description: Family registry
  - name: children
    description: Children management
  - name: classes
    description: Class management
  - name: classAssignments
    description: Class assignments
  - name: teachers
    description: Teacher management
  - name: teacherAllocations
    description: Teacher allocations
  - name: attendance
    description: Attendance tracking
  - name: pickupDelegates
    description: Pickup delegate management
  - name: notifications
    description: Notification center
  - name: feedback
    description: Parent feedback
  - name: appraisals
    description: Child appraisals
  - name: safeguarding
    description: Safeguarding and DBS records
  - name: emergencies
    description: Emergency management
  - name: auditLogs
    description: Audit trail
  - name: dashboard
    description: Admin dashboard analytics

paths:
  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
        '500':
          description: Failed to generate upload URL.
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an uploaded object
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # AUTH
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterBody"
      responses:
        "201":
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get current authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout and revoke all authenticated sessions
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Authentication is missing, invalid, expired, or revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change the current user's password and replace the current session
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChangeInput"
      responses:
        "200":
          description: Password changed; all previous bearer tokens are revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionReplacementResponse"
        "400":
          description: Invalid password input or current password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication is missing, invalid, expired, or revoked

  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Reset a password using a delivered reset code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetInput"
      responses:
        "200":
          description: Password reset and all prior authenticated sessions revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Invalid, expired, consumed, or attempt-limited reset code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many reset attempts

  /auth/send-otp:
    post:
      operationId: sendRegistrationOtp
      tags: [auth]
      summary: Send a purpose-, channel-, and contact-bound registration code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationOtpInput"
      responses:
        "200":
          description: Verification code accepted for sending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationOtpResponse"
        "400":
          description: The selected channel's required contact is invalid
        "429":
          description: Issuance limit or contact cooldown reached
        "503":
          description: The selected delivery provider did not accept the request

  /auth/mfa/setup:
    post:
      operationId: setupMfa
      tags: [auth]
      summary: Begin MFA setup after password step-up
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaSetupInput"
      responses:
        "200":
          description: Pending authenticator configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaSetupResponse"
        "401":
          description: Authentication or current-password proof failed
        "409":
          description: Active MFA must be disabled before replacement
        "429":
          description: Too many attempts

  /auth/mfa/confirm:
    post:
      operationId: confirmMfa
      tags: [auth]
      summary: Confirm pending MFA and replace the current session
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaConfirmationInput"
      responses:
        "200":
          description: MFA enabled; all previous bearer tokens are revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionReplacementResponse"
        "400":
          description: MFA setup is absent or the authenticator code is invalid
        "401":
          description: Authentication is missing, invalid, expired, or revoked
        "429":
          description: Too many attempts

  /auth/mfa/disable:
    post:
      operationId: disableMfa
      tags: [auth]
      summary: Disable MFA after password and authenticator step-up
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaDisableInput"
      responses:
        "200":
          description: MFA disabled; all previous bearer tokens are revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionReplacementResponse"
        "400":
          description: MFA is not active or the authenticator code is invalid
        "401":
          description: Authentication or current-password proof failed
        "429":
          description: Too many attempts

  /events/ticket:
    post:
      operationId: createSseTicket
      tags: [auth]
      summary: Mint a one-time cookie for the SSE endpoint
      security:
        - bearerAuth: []
      responses:
        "201":
          description: SSE ticket cookie minted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SseTicketResponse"
        "401":
          description: Authentication required

  # USERS
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users
      parameters:
        - name: role
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedUsers"
    post:
      operationId: createUser
      tags: [users]
      summary: Create user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserBody"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    put:
      operationId: updateUser
      tags: [users]
      summary: Update user
      description: A self-service phone-number change requires currentPassword. Other updates do not.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserBody"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Authentication or required current-password proof failed
        "403":
          description: The authenticated user cannot update this account
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /users/pending:
    get:
      operationId: listPendingUsers
      tags: [users]
      summary: List users pending approval
      responses:
        "200":
          description: Pending users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedUsers"

  /users/{id}/approve:
    put:
      operationId: approveUser
      tags: [users]
      summary: Approve a pending user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /users/{id}/reset-password:
    put:
      operationId: adminResetUserPassword
      tags: [users]
      summary: Administratively reset another user's password and revoke their sessions
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminPasswordResetInput"
      responses:
        "200":
          description: Password reset and target user's sessions revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Invalid password, ID, or attempt to use the administrator route for self
        "401":
          description: Authentication is missing, invalid, expired, or revoked
        "403":
          description: Administrator permission is required
        "404":
          description: Target user not found

  /users/{id}/reject:
    put:
      operationId: rejectUser
      tags: [users]
      summary: Reject a pending user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /users/{id}/suspend:
    put:
      operationId: suspendUser
      tags: [users]
      summary: Suspend a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User suspended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  # FAMILIES
  /families:
    get:
      operationId: listFamilies
      tags: [families]
      summary: List families
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Families list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedFamilies"
    post:
      operationId: createFamily
      tags: [families]
      summary: Create family
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFamilyBody"
      responses:
        "201":
          description: Family created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Family"

  /families/{id}:
    get:
      operationId: getFamily
      tags: [families]
      summary: Get family by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Family
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Family"
    put:
      operationId: updateFamily
      tags: [families]
      summary: Update family
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFamilyBody"
      responses:
        "200":
          description: Updated family
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Family"

  /families/{id}/tree:
    get:
      operationId: getFamilyTree
      tags: [families]
      summary: Get family tree with children and class info
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Family tree
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyTree"

  /families/my:
    get:
      operationId: getMyFamily
      tags: [families]
      summary: Get current parent's family
      responses:
        "200":
          description: My family
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Family"

  # CHILDREN
  /children:
    get:
      operationId: listChildren
      tags: [children]
      summary: List children
      parameters:
        - name: classId
          in: query
          schema:
            type: integer
        - name: familyId
          in: query
          schema:
            type: integer
        - name: unassigned
          in: query
          schema:
            type: boolean
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Children list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedChildren"
    post:
      operationId: createChild
      tags: [children]
      summary: Create child
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChildBody"
      responses:
        "201":
          description: Child created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Child"

  /children/{id}:
    get:
      operationId: getChild
      tags: [children]
      summary: Get child by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Child
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Child"
    put:
      operationId: updateChild
      tags: [children]
      summary: Update child
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChildBody"
      responses:
        "200":
          description: Updated child
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Child"

  /children/{id}/qr-code:
    get:
      operationId: getChildQrCode
      tags: [children]
      summary: Get QR code for child
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: QR code data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QrCodeData"

  # CLASSES
  /classes:
    get:
      operationId: listClasses
      tags: [classes]
      summary: List classes
      parameters:
        - name: serviceSlot
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Classes list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Class"
    post:
      operationId: createClass
      tags: [classes]
      summary: Create class
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClassBody"
      responses:
        "201":
          description: Class created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Class"

  /classes/{id}:
    get:
      operationId: getClass
      tags: [classes]
      summary: Get class by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Class
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Class"
    put:
      operationId: updateClass
      tags: [classes]
      summary: Update class
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClassBody"
      responses:
        "200":
          description: Updated class
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Class"
    delete:
      operationId: deleteClass
      tags: [classes]
      summary: Delete class
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  # CLASS ASSIGNMENTS
  /class-assignments:
    get:
      operationId: listClassAssignments
      tags: [classAssignments]
      summary: List class assignments
      parameters:
        - name: classId
          in: query
          schema:
            type: integer
        - name: childId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Assignments list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClassAssignment"
    post:
      operationId: createClassAssignment
      tags: [classAssignments]
      summary: Assign child to class
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClassAssignmentBody"
      responses:
        "201":
          description: Assignment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassAssignment"

  /class-assignments/{id}:
    put:
      operationId: updateClassAssignment
      tags: [classAssignments]
      summary: Update class assignment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateClassAssignmentBody"
      responses:
        "200":
          description: Updated assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassAssignment"

  # TEACHERS
  /teachers:
    get:
      operationId: listTeachers
      tags: [teachers]
      summary: List teachers
      responses:
        "200":
          description: Teachers list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Teacher"
    post:
      operationId: createTeacher
      tags: [teachers]
      summary: Create teacher profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTeacherBody"
      responses:
        "201":
          description: Teacher created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Teacher"

  /teachers/{id}:
    get:
      operationId: getTeacher
      tags: [teachers]
      summary: Get teacher by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Teacher
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Teacher"
    put:
      operationId: updateTeacher
      tags: [teachers]
      summary: Update teacher
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTeacherBody"
      responses:
        "200":
          description: Updated teacher
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Teacher"

  # TEACHER ALLOCATIONS
  /teacher-allocations:
    get:
      operationId: listTeacherAllocations
      tags: [teacherAllocations]
      summary: List teacher allocations
      parameters:
        - name: serviceDate
          in: query
          schema:
            type: string
        - name: classId
          in: query
          schema:
            type: integer
        - name: teacherId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Allocations list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeacherAllocation"
    post:
      operationId: createTeacherAllocation
      tags: [teacherAllocations]
      summary: Allocate teacher to class
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTeacherAllocationBody"
      responses:
        "201":
          description: Allocation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherAllocation"

  /teacher-allocations/{id}:
    put:
      operationId: updateTeacherAllocation
      tags: [teacherAllocations]
      summary: Update teacher allocation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTeacherAllocationBody"
      responses:
        "200":
          description: Updated allocation
          content:
