        enrollmentCount:
          type: integer
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - ageMin
        - ageMax
        - capacity
        - roomLocation
        - serviceSlot
        - enrollmentCount
        - createdAt

    CreateClassBody:
      type: object
      properties:
        name:
          type: string
        ageMin:
          type: integer
        ageMax:
          type: integer
        capacity:
          type: integer
        roomLocation:
          type: string
        serviceSlot:
          type: string
          enum: ["7am", "10:30am"]
        description:
          type: string
          nullable: true
      required:
        - name
        - ageMin
        - ageMax
        - capacity
        - roomLocation
        - serviceSlot

