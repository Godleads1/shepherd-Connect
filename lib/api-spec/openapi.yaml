        - requestedClassId
        - status
        - requestedBy
        - createdAt
        - updatedAt

    CreateClassChangeRequestBody:
      type: object
      properties:
        childId:
          type: integer
        requestedClassId:
          type: integer
        currentClassId:
          type: integer
          nullable: true
        reason:
          type: string
          nullable: true
      required:
        - childId
        - requestedClassId
