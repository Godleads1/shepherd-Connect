        - classesInSession
        - activeEmergencies
        - unassignedChildren
        - totalChildren

    LiveClassView:
      type: object
      properties:
        classId:
          type: integer
        className:
          type: string
        roomLocation:
          type: string
        serviceSlot:
          type: string
        capacity:
          type: integer
        inClass:
          type: integer
        dropped:
          type: integer
        pickedUp:
          type: integer
        teacherName:
          type: string
          nullable: true
        children:
          type: array
