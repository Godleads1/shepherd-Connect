    get:
      operationId: exportEmergencyLog
      tags: [reports]
      summary: Export emergency incident log
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [json, csv]
            default: json
      responses:
        "200":
          description: Emergency log

  /reports/teacher-ratios:
    get:
      operationId: getTeacherRatios
      tags: [reports]
      summary: Get teacher-to-child ratios per class
      parameters:
        - name: serviceDate
          in: query
          schema:
            type: string
        - name: serviceSlot
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Teacher ratio data
          content:
            application/json:
              schema:
                type: object
                properties:
                  date:
                    type: string
                  classes:
                    type: array
                    items:
                      type: object
                required: [date, classes]

  /reports/summary:
    get:
      operationId: getReportSummary
      tags: [reports]
      summary: Get daily summary report
      parameters:
        - name: serviceDate
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Summary report
          content:
            application/json:
              schema:
                type: object
                properties:
                  date:
                    type: string
                  totalCheckedIn:
                    type: integer
                  stillPresent:
                    type: integer
                  pickedUp:
                    type: integer
                  pendingDelegateApprovals:
                    type: integer
                  pendingUserApprovals:
                    type: integer
                required: [date, totalCheckedIn, stillPresent, pickedUp]

  # CLASS CHANGE REQUESTS
  /class-change-requests:
    get:
      operationId: listClassChangeRequests
      tags: [classChangeRequests]
      summary: List class change requests
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, rejected]
      responses:
        "200":
          description: Class change requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ClassChangeRequest"
                  total:
                    type: integer
                required: [data, total]
    post:
      operationId: createClassChangeRequest
      tags: [classChangeRequests]
      summary: Submit a class change request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClassChangeRequestBody"
      responses:
        "201":
          description: Request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassChangeRequest"

  /class-change-requests/{id}/approve:
    put:
      operationId: approveClassChangeRequest
      tags: [classChangeRequests]
      summary: Approve a class change request (moves child to new class)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                adminNotes:
                  type: string
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /class-change-requests/{id}/reject:
    put:
      operationId: rejectClassChangeRequest
      tags: [classChangeRequests]
      summary: Reject a class change request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                adminNotes:
                  type: string
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /class-change-requests/{id}:
    delete:
      operationId: cancelClassChangeRequest
      tags: [classChangeRequests]
      summary: Cancel a class change request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /custody-episodes:
    post:
      operationId: acceptCustodyEpisode
      tags: [attendance]
      summary: Support accepts a parent-requested physical custody episode
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustodyAcceptanceInput"
      responses:
        "201":
          description: Custody accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustodyEpisodeResult"
        "409":
          description: Child already has open custody
  /custody-episodes/pending:
    get:
      operationId: listPendingCustodyEpisodes
      tags: [attendance]
      summary: List parent-requested custody episodes awaiting support acceptance
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Pending episodes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CustodyEpisode"
  /custody-requests:
    post:
      operationId: requestCustodyEpisode
      tags: [attendance]
      summary: Parent requests per-child handover; this is not custody acceptance
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustodyRequestInput"
      responses:
        "201":
          description: Request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustodyRequestResult"
    get:
      operationId: listMyCustodyRequests
      tags: [attendance]
      summary: List the authenticated parent's custody requests
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CustodyEpisode"
  /custody-requests/{id}:
    delete:
      operationId: cancelCustodyRequest
      tags: [attendance]
      summary: Parent cancels an unaccepted custody request
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CustodyEpisodeId"
      responses:
        "200":
          description: Request cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustodyRequestResult"
  /custody-episodes/{id}/pickup:
    post:
      operationId: completeCustodyPickup
      tags: [attendance]
      summary: Accepting support custodian completes pickup
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CustodyEpisodeId"
      responses:
        "200":
          description: Pickup completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustodyEpisodeResult"
  /custody-episodes/{id}/override-pickup:
    post:
      operationId: overrideCustodyPickup
      tags: [attendance]
      summary: Admin override of custody pickup, requiring a reason
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CustodyEpisodeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustodyOverrideInput"
      responses:
        "200":
          description: Pickup override completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustodyEpisodeResult"

  /parent-requests:
    get:
      operationId: listParentRequests
      tags: [parentRequests]
      summary: List the authenticated parent's request center
      security:
        - bearerAuth: []
      parameters:
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/ParentRequestType"
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Parent-scoped request summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParentRequestCenter"
  /parent-requests/{type}/{id}:
    get:
      operationId: getParentRequest
      tags: [parentRequests]
      summary: Get one request owned by the authenticated parent
      security:
        - bearerAuth: []
      parameters:
        - name: type
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ParentRequestType"
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Parent request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParentRequestItem"
        "404":
          description: Request is not owned by this parent
  /pickup-requests:
    post:
      operationId: createParentPickupRequest
      tags: [parentRequests]
      summary: Idempotently signal pickup for an active checked-in owned child
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParentPickupRequestInput"
      responses:
        "200":
          description: Pickup signal is active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParentPickupRequestResult"

  /safeguarding:
    post:
      operationId: createSafeguardingRecord
      tags: [safeguarding]
      summary: Create a safeguarding record
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SafeguardingRecordInput"
      responses:
        "201":
          description: Safeguarding record applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SafeguardingOperationResult"
        "200":
          description: Safeguarding record already applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SafeguardingOperationResult"
        "409":
          description: Operation ID is bound to different input
  /safeguarding/operations/{operationId}:
    get:
      operationId: getSafeguardingOperation
      tags: [safeguarding]
      summary: Reconcile a safeguarding record operation
      security:
        - bearerAuth: []
      parameters:
        - name: operationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Original authorized safeguarding result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SafeguardingOperationResult"
        "404":
          description: No matching authorized operation exists

components:
  parameters:
    CustodyEpisodeId:
      name: id
      in: path
      required: true
      schema:
        type: integer
  schemas:
    ParentRequestType:
      type: string
      enum: [custody, pickup, delegate, class_change, concern, feedback]
    ParentRequestChild:
      type: object
      required: [id, firstName, lastName, checkedIn]
      properties:
        id:
          type: integer
        firstName:
          type: string
        lastName:
          type: string
        checkedIn:
          type: boolean
    ParentRequestItem:
      type: object
      required: [id, sourceId, requestType, title, childId, childName, status, serviceDate, createdAt, deepLink, summary]
      properties:
        id:
          type: string
        sourceId:
          oneOf:
            - type: integer
            - type: string
        requestType:
          $ref: "#/components/schemas/ParentRequestType"
        title:
          type: string
        childId:
          type: [integer, "null"]
        childName:
          type: [string, "null"]
        status:
          type: string
        serviceDate:
          type: [string, "null"]
          format: date
        createdAt:
          type: string
          format: date-time
        deepLink:
          type: string
        summary:
          type: [string, "null"]
    ParentRequestCenter:
      type: object
      required: [items, children, counts, total, refreshedAt]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ParentRequestItem"
        children:
          type: array
          items:
            $ref: "#/components/schemas/ParentRequestChild"
        counts:
          type: object
          additionalProperties:
            type: integer
        total:
          type: integer
        refreshedAt:
          type: string
          format: date-time
    ParentPickupRequestInput:
      type: object
      required: [childId]
      properties:
        childId:
          type: integer
          minimum: 1
    ParentPickupRequest:
      type: object
      required: [id, childId, childName, parentName, classId, className, requestedAt]
      properties:
        id:
          type: string
        childId:
          type: integer
        childName:
          type: string
        parentName:
          type: string
        classId:
          type: integer
        className:
          type: string
        homeClassName:
          type: string
        requestedAt:
          type: string
          format: date-time
    ParentPickupRequestResult:
      type: object
      required: [success, duplicate, status, request, message]
      properties:
        success:
          type: boolean
        duplicate:
          type: boolean
        status:
          type: string
          enum: [requested]
        request:
          $ref: "#/components/schemas/ParentPickupRequest"
        message:
          type: string
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
        size:
          type: integer
          minimum: 1
        contentType:
          type: string
          minLength: 1
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
        objectPath:
          type: string
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    CustodyAcceptanceInput:
      type: object
      required: [episodeId]
      properties:
        episodeId:
          type: integer
          minimum: 1
        eventId:
          type: string
          minLength: 1
          maxLength: 128
    CustodyRequestInput:
      type: object
      required: [childId, serviceDate, requestedServices, eventId]
      properties:
        childId: { type: integer, minimum: 1 }
        serviceDate: { type: string, format: date }
        requestedServices: { type: string, enum: [first, second, both] }
        eventId: { type: string, minLength: 1, maxLength: 128 }
    CustodyOverrideInput:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
    CustodyEpisode:
      type: object
      required: [id, childId, familyId, serviceDate, requestedServices, requestedBy, requestedAt, status]
      properties:
        id: { type: integer }
        childId: { type: integer }
        familyId: { type: integer }
        serviceDate: { type: string, format: date }
        requestedServices: { type: string, enum: [first, second, both] }
        requestedBy: { type: integer }
        requestedAt: { type: string, format: date-time }
        custodianUserId: { type: [integer, "null"] }
        status: { type: string, enum: [requested, accepted, picked_up, cancelled] }
        acceptedAt: { type: [string, "null"], format: date-time }
        pickedUpAt: { type: [string, "null"], format: date-time }
        pickedUpBy: { type: [integer, "null"] }
        overrideReason: { type: [string, "null"] }
        overriddenBy: { type: [integer, "null"] }
        checkoutMode: { type: [string, "null"], enum: [normal, admin_override, null] }
    CustodyEpisodeResult:
      type: object
      required: [episode, attendance, duplicate]
      properties:
        episode:
          $ref: "#/components/schemas/CustodyEpisode"
        attendance:
          type: array
          items:
            $ref: "#/components/schemas/Attendance"
        duplicate: { type: boolean }
    CustodyRequestResult:
      type: object
      required: [episode, duplicate]
      properties:
        episode:
          $ref: "#/components/schemas/CustodyEpisode"
        duplicate: { type: boolean }
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error
        - message

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required:
        - success

    SseTicketResponse:
      type: object
      properties:
        expiresAt:
          type: string
          format: date-time
      required:
        - expiresAt

    # AUTH
    LoginBody:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
        - email
        - password

    RegisterBody:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        password:
          type: string
        role:
          type: string
          enum: [super_admin, admin, teacher, support, parent]
        otpPinId:
          type: string
          minLength: 1
      required:
        - firstName
        - lastName
        - email
        - password
        - role
        - otpPinId

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"
      required:
        - token
        - user

    PasswordChangeInput:
      type: object
      additionalProperties: false
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 6
      required: [currentPassword, newPassword]

    PasswordResetInput:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        code:
          type: string
        newPassword:
          type: string
          minLength: 6
      required: [email, code, newPassword]

    AdminPasswordResetInput:
      type: object
      additionalProperties: false
      properties:
        password:
          type: string
          minLength: 6
      required: [password]

    SessionReplacementResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        token:
          type: string
          description: Replacement bearer token for the session that performed the change.
      required: [success, message, token]

    MfaSetupInput:
      type: object
      additionalProperties: false
      properties:
        currentPassword:
          type: string
      required: [currentPassword]

    MfaSetupResponse:
      type: object
      properties:
        qrCodeUri:
          type: string
        secret:
          type: string
      required: [qrCodeUri, secret]

    MfaConfirmationInput:
      type: object
      additionalProperties: false
      properties:
        totpCode:
          type: string
          pattern: '^\d{6}$'
      required: [totpCode]

    MfaDisableInput:
      type: object
      additionalProperties: false
      properties:
        totpCode:
          type: string
          pattern: '^\d{6}$'
        currentPassword:
          type: string
      required: [totpCode, currentPassword]

    RegistrationOtpInput:
      type: object
      additionalProperties: false
      properties:
        phone:
          type: string
          description: Required when channel is sms or whatsapp.
        email:
          type: string
          format: email
          description: Required when channel is email.
        channel:
          type: string
          enum: [sms, whatsapp, email]
      required: [channel]
      anyOf:
        - properties:
            channel:
              enum: [sms, whatsapp]
          required: [phone]
        - properties:
            channel:
              const: email
          required: [email]

    RegistrationOtpResponse:
      type: object
      properties:
        pinId:
          type: string
        message:
          type: string
      required: [pinId, message]

    # USER
    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        phone:
          type: string
          nullable: true
        role:
          type: string
          enum: [super_admin, admin, teacher, support, parent]
        firstName:
          type: string
        lastName:
          type: string
        isActive:
          type: boolean
        status:
          type: string
          enum: [active, pending_approval, suspended]
        photoUrl:
          type: string
          nullable: true
        dob:
          type: string
          format: date
          nullable: true
        gender:
          type: string
          nullable: true
        placeOfWork:
          type: string
          nullable: true
        communicationPrefs:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - email
        - role
        - firstName
        - lastName
        - isActive
        - status
        - createdAt

    CreateUserBody:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        password:
          type: string
        role:
          type: string
      required:
        - firstName
        - lastName
        - email
        - password
        - role

    UpdateUserBody:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
        isActive:
          type: boolean
        role:
          type: string
        currentPassword:
          type: string
          description: Required only when the authenticated user changes their own phone number.

    PaginatedUsers:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/User"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
      required:
        - data
        - total
        - page
        - limit

    # FAMILY
    Family:
      type: object
      properties:
        id:
          type: integer
        familyCode:
          type: string
        parent1Id:
          type: integer
          nullable: true
        parent2Id:
          type: integer
          nullable: true
        parent1:
          $ref: "#/components/schemas/User"
          nullable: true
        parent2:
          $ref: "#/components/schemas/User"
          nullable: true
        address:
          type: string
          nullable: true
        emergencyContactName:
          type: string
          nullable: true
        emergencyContactPhone:
          type: string
          nullable: true
        children:
          type: array
          items:
            $ref: "#/components/schemas/Child"
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - familyCode
        - createdAt

    CreateFamilyBody:
      type: object
      properties:
        parent1Id:
          type: integer
        parent2Id:
          type: integer
          nullable: true
        address:
          type: string
        emergencyContactName:
          type: string
        emergencyContactPhone:
          type: string
      required:
        - parent1Id

    PaginatedFamilies:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Family"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
      required:
        - data
        - total
        - page
        - limit

    FamilyTree:
      type: object
      properties:
        family:
          $ref: "#/components/schemas/Family"
        parents:
          type: array
          items:
            $ref: "#/components/schemas/User"
        children:
          type: array
          items:
            $ref: "#/components/schemas/ChildWithDetails"
      required:
        - family
        - parents
        - children

    ChildWithDetails:
      type: object
      properties:
        id:
          type: integer
        firstName:
          type: string
        lastName:
          type: string
        dob:
          type: string
          format: date
        age:
          type: integer
        gender:
          type: string
        photoUrl:
          type: string
          nullable: true
        currentClass:
          $ref: "#/components/schemas/Class"
          nullable: true
        teacher:
          $ref: "#/components/schemas/User"
          nullable: true
        lastAttendance:
          type: string
          nullable: true
        attendanceHistory:
          type: array
          items:
            $ref: "#/components/schemas/Attendance"
      required:
        - id
        - firstName
        - lastName
        - dob
        - age
        - gender

    # CHILD
    Child:
      type: object
      properties:
        id:
          type: integer
        familyId:
          type: integer
        firstName:
          type: string
        lastName:
          type: string
        dob:
          type: string
          format: date
        age:
          type: integer
        gender:
          type: string
        allergies:
          type: string
          nullable: true
        medicalNotes:
          type: string
          nullable: true
        photoUrl:
          type: string
          nullable: true
        hasFaceDescriptor:
          type: boolean
        servicePreference:
          type: string
          enum: ["7am", "10:30am", "both"]
          nullable: true
        currentClassId:
          type: integer
          nullable: true
