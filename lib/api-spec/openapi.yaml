        - serviceSlot

    UpdateTeacherAllocationBody:
      type: object
      properties:
        status:
          type: string
          enum: [scheduled, confirmed, completed, cancelled]
        teacherId:
          type: integer
        classId:
          type: integer
        serviceDate:
          type: string
          format: date
        serviceSlot:
          type: string

    # ATTENDANCE
    Attendance:
      type: object
      properties:
        id:
          type: integer
        childId:
          type: integer
        classId:
          type: integer
        serviceDate:
          type: string
          format: date
        serviceSlot:
          type: string
        checkInTime:
          type: string
          format: date-time
          nullable: true
        escortTime:
          type: string
          format: date-time
          nullable: true
        checkOutTime:
          type: string
          format: date-time
          nullable: true
        checkedInBy:
          type: integer
          nullable: true
        escortedBy:
          type: integer
          nullable: true
        checkedOutBy:
          type: integer
          nullable: true
        status:
          type: string
          enum: [dropped_off, in_transit, in_class, picked_up]
        child:
          $ref: "#/components/schemas/Child"
          nullable: true
        class:
          $ref: "#/components/schemas/Class"
          nullable: true
      required:
        - id
        - childId
        - classId
        - serviceDate
        - serviceSlot
        - status

    CheckInBody:
      type: object
      properties:
        childId:
          type: integer
        classId:
          type: integer
        serviceDate:
          type: string
          format: date
        serviceSlot:
          type: string
        bothServices:
          type: boolean
          description: >-
            Set by the check-in UI when staff deliberately book BOTH services
            at drop-off. Skips the guard that otherwise blocks checking in for
            a second service while the child is still checked in (not checked
            out) for the other service.
        eventId:
          type: string
          minLength: 1
          maxLength: 200
          description: Client-generated idempotency event identifier.
        originatingUserId:
          type: integer
          description: Authenticated user who originated the event.
        originatingRole:
          type: string
          enum: [super_admin, admin, teacher, support, parent]
          description: Active authenticated role that originated the event.
        queuedAt:
          type: string
          format: date-time
          description: Time the client queued the attendance event.
      required:
        - childId
        - classId
        - serviceDate
        - serviceSlot

    CheckOutBody:
      type: object
      properties:
        notes:
          type: string
          nullable: true

    ScanQrBody:
      type: object
      properties:
        qrCode:
          type: string
        serviceDate:
          type: string
          format: date
        serviceSlot:
          type: string
      required:
        - qrCode
        - serviceDate
        - serviceSlot

    QrScanResult:
      type: object
      properties:
        family:
          $ref: "#/components/schemas/Family"
        children:
          type: array
          items:
            $ref: "#/components/schemas/ChildWithDetails"
        hasAlerts:
          type: boolean
        alerts:
          type: array
          items:
            type: string
      required:
        - family
        - children
        - hasAlerts
        - alerts


    ScanFaceBody:
      type: object
      properties:
        descriptor:
          type: array
          items:
            type: number
          description: 128-dimension face descriptor vector from face-api.js
      required:
        - descriptor

    UpdateFaceDescriptorBody:
      type: object
      properties:
        descriptorJson:
          type: string
          description: JSON-encoded face descriptor vector
        consentGiven:
          type: boolean
      required:
        - descriptorJson
        - consentGiven

    # PICKUP DELEGATES
    PickupDelegate:
      type: object
      properties:
        id:
          type: integer
        childId:
          type: integer
        name:
          type: string
        phone:
          type: string
        photoUrl:
          type: string
          nullable: true
        otpCode:
          type: string
          nullable: true
        otpExpiresAt:
          type: string
          format: date-time
          nullable: true
        parentApproved:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - childId
        - name
        - phone
        - parentApproved
        - createdAt

    CreatePickupDelegateBody:
      type: object
      properties:
        childId:
          type: integer
        name:
          type: string
        phone:
          type: string
        photoUrl:
          type: string
          nullable: true
      required:
        - childId
        - name
        - phone

    VerifyOtpBody:
      type: object
