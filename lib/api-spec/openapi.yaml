        teacherId:
          type: integer
        classId:
          type: integer
        serviceDate:
          type: string
          format: date
        serviceSlot:
          type: string
        status:
          type: string
          enum: [scheduled, confirmed, completed, cancelled]
        teacher:
          $ref: "#/components/schemas/Teacher"
          nullable: true
        class:
          $ref: "#/components/schemas/Class"
          nullable: true
      required:
        - id
        - teacherId
        - classId
        - serviceDate
        - serviceSlot
        - status

    CreateTeacherAllocationBody:
      type: object
      properties:
        teacherId:
          type: integer
        classId:
          type: integer
        serviceDate:
          type: string
          format: date
        serviceSlot:
          type: string
      required:
        - teacherId
        - classId
