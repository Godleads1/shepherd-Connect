          nullable: true
        message:
          type: string
      required:
        - valid
        - message

    # NOTIFICATIONS
    Notification:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        type:
          type: string
        title:
          type: string
        message:
          type: string
        channel:
          type: string
          enum: [in_app, whatsapp, sms, email]
        readStatus:
          type: boolean
        metadataJson:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - type
        - title
        - message
        - channel
        - readStatus
        - createdAt

    PaginatedNotifications:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        total:
          type: integer
