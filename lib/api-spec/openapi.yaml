          type: integer
        reason:
          type: string
          nullable: true
        status:
          type: string
          enum: [pending, approved, rejected]
        requestedBy:
          type: integer
        reviewedBy:
          type: integer
          nullable: true
        adminNotes:
          type: string
          nullable: true
        child:
