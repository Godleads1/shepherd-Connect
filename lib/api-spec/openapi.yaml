      parameters:
        - name: serviceDate
          in: query
          schema:
            type: string
        - name: serviceSlot
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Not picked up report
          content:
            application/json:
              schema:
                type: object
                properties:
                  date:
                    type: string
                  total:
                    type: integer
                  children:
                    type: array
                    items:
                      type: object
                required: [date, total, children]

  /reports/attendance-export:
    get:
      operationId: exportAttendance
      tags: [reports]
      summary: Export attendance records (JSON or CSV)
      parameters:
        - name: from
          in: query
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
        - name: serviceSlot
          in: query
          schema:
            type: string
        - name: format
          in: query
          schema:
            type: string
            enum: [json, csv]
            default: json
      responses:
        "200":
          description: Attendance export

  /reports/emergency-log:
    get:
      operationId: exportEmergencyLog
      tags: [reports]
      summary: Export emergency incident log
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [json, csv]
            default: json
      responses:
        "200":
          description: Emergency log

  /reports/teacher-ratios:
    get:
      operationId: getTeacherRatios
      tags: [reports]
      summary: Get teacher-to-child ratios per class
      parameters:
        - name: serviceDate
          in: query
          schema:
            type: string
        - name: serviceSlot
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Teacher ratio data
          content:
            application/json:
              schema:
                type: object
                properties:
                  date:
                    type: string
                  classes:
                    type: array
                    items:
                      type: object
                required: [date, classes]

  /reports/summary:
    get:
      operationId: getReportSummary
      tags: [reports]
      summary: Get daily summary report
      parameters:
        - name: serviceDate
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Summary report
          content:
            application/json:
              schema:
                type: object
                properties:
                  date:
                    type: string
                  totalCheckedIn:
                    type: integer
                  stillPresent:
                    type: integer
                  pickedUp:
                    type: integer
                  pendingDelegateApprovals:
                    type: integer
                  pendingUserApprovals:
                    type: integer
                required: [date, totalCheckedIn, stillPresent, pickedUp]

  # CLASS CHANGE REQUESTS
  /class-change-requests:
    get:
      operationId: listClassChangeRequests
      tags: [classChangeRequests]
      summary: List class change requests
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, rejected]
      responses:
        "200":
          description: Class change requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ClassChangeRequest"
                  total:
                    type: integer
                required: [data, total]
    post:
      operationId: createClassChangeRequest
      tags: [classChangeRequests]
      summary: Submit a class change request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClassChangeRequestBody"
      responses:
        "201":
          description: Request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassChangeRequest"

  /class-change-requests/{id}/approve:
    put:
      operationId: approveClassChangeRequest
      tags: [classChangeRequests]
      summary: Approve a class change request (moves child to new class)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                adminNotes:
                  type: string
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /class-change-requests/{id}/reject:
    put:
      operationId: rejectClassChangeRequest
      tags: [classChangeRequests]
      summary: Reject a class change request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                adminNotes:
                  type: string
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /class-change-requests/{id}:
    delete:
      operationId: cancelClassChangeRequest
      tags: [classChangeRequests]
      summary: Cancel a class change request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

components:
  schemas:
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
        size:
          type: integer
          minimum: 1
        contentType:
          type: string
          minLength: 1
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
        objectPath:
          type: string
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error
        - message

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required:
        - success

    # AUTH
    LoginBody:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
        - email
        - password

    RegisterBody:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        password:
          type: string
        role:
          type: string
          enum: [super_admin, admin, teacher, support, parent]
        otpPinId:
          type: string
          minLength: 1
      required:
        - firstName
        - lastName
        - email
        - password
        - role
        - otpPinId

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"
      required:
        - token
        - user

    # USER
    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        phone:
          type: string
          nullable: true
        role:
          type: string
          enum: [super_admin, admin, teacher, support, parent]
        firstName:
          type: string
        lastName:
          type: string
        isActive:
          type: boolean
        status:
          type: string
          enum: [active, pending_approval, suspended]
        photoUrl:
          type: string
          nullable: true
        dob:
          type: string
          format: date
          nullable: true
        gender:
          type: string
          nullable: true
        placeOfWork:
          type: string
          nullable: true
        communicationPrefs:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - email
        - role
        - firstName
        - lastName
        - isActive
        - status
        - createdAt

    CreateUserBody:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        password:
          type: string
        role:
          type: string
      required:
        - firstName
        - lastName
        - email
        - password
        - role

    UpdateUserBody:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
        isActive:
          type: boolean
        role:
          type: string

    PaginatedUsers:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/User"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
      required:
        - data
        - total
        - page
        - limit

    # FAMILY
    Family:
      type: object
      properties:
        id:
          type: integer
        familyCode:
          type: string
        parent1Id:
          type: integer
          nullable: true
        parent2Id:
          type: integer
          nullable: true
        parent1:
          $ref: "#/components/schemas/User"
          nullable: true
        parent2:
          $ref: "#/components/schemas/User"
          nullable: true
        address:
          type: string
          nullable: true
        emergencyContactName:
          type: string
          nullable: true
        emergencyContactPhone:
          type: string
          nullable: true
        children:
          type: array
          items:
            $ref: "#/components/schemas/Child"
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - familyCode
        - createdAt

    CreateFamilyBody:
      type: object
      properties:
        parent1Id:
          type: integer
        parent2Id:
          type: integer
          nullable: true
        address:
          type: string
        emergencyContactName:
          type: string
        emergencyContactPhone:
          type: string
      required:
        - parent1Id

    PaginatedFamilies:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Family"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
      required:
        - data
        - total
        - page
        - limit

    FamilyTree:
      type: object
      properties:
        family:
          $ref: "#/components/schemas/Family"
        parents:
          type: array
          items:
            $ref: "#/components/schemas/User"
        children:
          type: array
          items:
            $ref: "#/components/schemas/ChildWithDetails"
      required:
        - family
        - parents
        - children

    ChildWithDetails:
      type: object
      properties:
        id:
          type: integer
        firstName:
          type: string
        lastName:
          type: string
        dob:
          type: string
          format: date
        age:
          type: integer
        gender:
          type: string
        photoUrl:
          type: string
          nullable: true
        currentClass:
          $ref: "#/components/schemas/Class"
          nullable: true
        teacher:
          $ref: "#/components/schemas/User"
          nullable: true
        lastAttendance:
          type: string
          nullable: true
        attendanceHistory:
          type: array
          items:
            $ref: "#/components/schemas/Attendance"
      required:
        - id
        - firstName
        - lastName
        - dob
        - age
        - gender

    # CHILD
    Child:
      type: object
      properties:
        id:
          type: integer
        familyId:
          type: integer
        firstName:
          type: string
        lastName:
          type: string
        dob:
          type: string
          format: date
        age:
          type: integer
        gender:
          type: string
        allergies:
          type: string
          nullable: true
        medicalNotes:
          type: string
          nullable: true
        photoUrl:
          type: string
          nullable: true
        faceDescriptorJson:
          type: string
          nullable: true
        servicePreference:
          type: string
          enum: ["7am", "10:30am", "both"]
          nullable: true
        currentClassId:
          type: integer
          nullable: true
        currentClass:
          $ref: "#/components/schemas/Class"
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - familyId
        - firstName
        - lastName
        - dob
        - age
        - gender
        - createdAt

    CreateChildBody:
      type: object
      properties:
        familyId:
          type: integer
        firstName:
          type: string
        lastName:
          type: string
        dob:
          type: string
          format: date
        gender:
          type: string
          enum: [male, female]
        allergies:
          type: string
          nullable: true
        medicalNotes:
          type: string
          nullable: true
        photoUrl:
          type: string
          nullable: true
        faceDescriptorJson:
          type: string
          nullable: true
        servicePreference:
          type: string
          enum: ["7am", "10:30am", "both"]
          nullable: true
      required:
        - familyId
        - firstName
        - lastName
        - dob
        - gender

    PaginatedChildren:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Child"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
      required:
        - data
        - total
        - page
        - limit

    QrCodeData:
      type: object
      properties:
        qrCode:
          type: string
        familyCode:
          type: string
        childId:
          type: integer
      required:
        - qrCode
        - familyCode
        - childId

    # CLASS
    Class:
      type: object
      properties:
        id:
