          type: integer
        page:
          type: integer
        limit:
          type: integer
      required:
        - data
        - total
        - unreadCount
        - page
        - limit

    # FEEDBACK
    Feedback:
      type: object
      properties:
        id:
          type: integer
        parentId:
          type: integer
        serviceDate:
          type: string
          format: date
        rating:
          type: number
        classExperience:
          type: number
        teacherEngagement:
          type: number
        safetyRating:
          type: number
        improvementNote:
          type: string
          nullable: true
        sentimentScore:
          type: number
          nullable: true
          description: AI-scored sentiment from -1 (very negative) to 1 (very positive)
        sentimentLabel:
          type: string
          nullable: true
          enum: [positive, neutral, negative]
          description: AI-derived sentiment category
        sentimentNote:
          type: string
          nullable: true
          description: Brief AI-generated insight about the feedback
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - parentId
        - serviceDate
        - rating
        - classExperience
        - teacherEngagement
        - safetyRating
        - createdAt

    CreateFeedbackBody:
      type: object
      properties:
        serviceDate:
          type: string
          format: date
        rating:
          type: number
          minimum: 1
          maximum: 5
        classExperience:
          type: number
          minimum: 1
          maximum: 5
        teacherEngagement:
          type: number
          minimum: 1
          maximum: 5
        safetyRating:
          type: number
          minimum: 1
          maximum: 5
        improvementNote:
          type: string
          nullable: true
      required:
        - serviceDate
        - rating
        - classExperience
        - teacherEngagement
        - safetyRating

    PaginatedFeedback:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Feedback"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
      required:
        - data
        - total
        - page
        - limit

