          type: integer
        pickedUp:
          type: integer
      required:
        - date
        - total
        - checkedIn
        - pickedUp

    ClassUtilization:
      type: object
      properties:
        classId:
          type: integer
        className:
          type: string
        capacity:
          type: integer
        enrolled:
          type: integer
        utilizationPercent:
          type: number
      required:
        - classId
        - className
        - capacity
        - enrolled
        - utilizationPercent

    SentimentBreakdown:
      type: object
      properties:
        positive:
          type: integer
        neutral:
          type: integer
        negative:
          type: integer
        unanalyzed:
          type: integer
        positivePercent:
          type: number
        neutralPercent:
          type: number
        negativePercent:
          type: number
      required:
        - positive
        - neutral
        - negative
        - unanalyzed
        - positivePercent
        - neutralPercent
        - negativePercent

    FeedbackAnalytics:
      type: object
      properties:
        averageRating:
          type: number
        averageClassExperience:
          type: number
        averageTeacherEngagement:
          type: number
        averageSafetyRating:
          type: number
        totalResponses:
          type: integer
        sentimentBreakdown:
          $ref: "#/components/schemas/SentimentBreakdown"
        recentFeedback:
          type: array
          items:
            $ref: "#/components/schemas/Feedback"
      required:
        - averageRating
        - averageClassExperience
        - averageTeacherEngagement
        - averageSafetyRating
        - totalResponses
        - sentimentBreakdown
        - recentFeedback

    ExceptionReport:
      type: object
      properties:
