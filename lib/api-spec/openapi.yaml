        - createdAt

    CreateAppraisalBody:
      type: object
      properties:
        childId:
          type: integer
        serviceDate:
          type: string
          format: date
        participationLevel:
          type: string
          enum: [excellent, good, fair, needs_encouragement]
        scriptureEngagement:
          type: string
          enum: [excellent, good, fair, needs_encouragement]
        socialInteraction:
          type: string
          enum: [excellent, good, fair, needs_encouragement]
        milestoneNote:
          type: string
          nullable: true
        personalNoteToParent:
          type: string
          nullable: true
      required:
        - childId
        - serviceDate
        - participationLevel
        - scriptureEngagement
        - socialInteraction

